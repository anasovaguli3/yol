<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StepLine</title>
<meta http-equiv="refresh" content="2;url=https://stepline1.github.io/">
<link rel="canonical" href="https://stepline1.github.io/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#0f1020;color:#f3f3f7;text-align:center;padding:16px}
  a{color:#8be9c0;font-weight:600}
</style>
</head>
<body>
<p>O'yin yangi manzilga ko'chdi: <strong>StepLine</strong><br><br>
<a href="https://stepline1.github.io/">stepline1.github.io</a></p>
<script>
  // Eski oflayn nusxani o'chiramiz, keyin yangi manzilga o'tamiz.
  (async () => {
    try {
      const regs = await navigator.serviceWorker?.getRegistrations?.() ?? [];
      await Promise.all(regs.map((r) => r.unregister()));
      const keys = (await caches?.keys?.()) ?? [];
      await Promise.all(keys.map((k) => caches.delete(k)));
    } catch {}
    location.replace('https://stepline1.github.io/');
  })();
</script>
</body>
</html>
